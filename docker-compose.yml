# Typesense vector database and Redis for Lens. Run: docker compose up -d typesense redis
services:
  typesense:
    image: typesense/typesense:27.1
    container_name: lens-typesense
    restart: unless-stopped
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "${TYPESENSE_API_KEY:-lens-local-typesense}"
      - "--enable-cors"
    ports:
      - "8108:8108"
    volumes:
      - lens_typesense_data:/data

  redis:
    image: redis:7.4-alpine
    container_name: lens-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  lens_typesense_data:
